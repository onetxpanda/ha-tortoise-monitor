<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tortoise Monitor</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--line:#2a2f3a;--fg:#e8eaed;--mut:#9aa0a6;--acc:#f2c94c;--ok:#3fb950;--bad:#f85149;--btn:#222733;--yes:#1f7a3f;--no:#8f2a2a}
@media (prefers-color-scheme: light){:root{--bg:#f5f6f8;--panel:#fff;--line:#dde1e6;--fg:#16181d;--mut:#5f6670;--btn:#eef0f3}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:flex;min-height:100vh}
aside{width:250px;flex:none;background:var(--panel);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;padding:12px 8px}
.brand{font-weight:600;font-size:16px;padding:4px 10px 14px}
.content{flex:1;min-width:0}
.topbar{display:none}
main{max-width:1280px;margin:0 auto;padding:16px 20px 40px}
main.stale{filter:grayscale(1) opacity(.55);pointer-events:none;user-select:none}
main h2{font-size:20px;margin:0 0 10px;font-weight:600}
.conn-banner{padding:9px 20px;background:var(--bad);color:#fff;font-size:14px;font-weight:600}
.nv{margin:2px 0}
.nv-i{display:flex;align-items:center;gap:2px;border-radius:7px;padding:1px 6px 1px 2px}
.nv-i a{flex:1;color:var(--fg);text-decoration:none;padding:7px 2px}
.nv-i.on{background:var(--btn)}
.chev{width:24px;height:24px;flex:none;padding:0;border:0;background:none;color:var(--mut);font-size:11px;display:inline-flex;align-items:center;justify-content:center;transition:transform .15s}
.nv.open .chev.tg{transform:rotate(90deg)}
.nv-kids{margin:2px 0 6px 26px;padding-left:4px;border-left:1px solid var(--line)}
.nv-k{display:flex;align-items:center;gap:6px;color:var(--mut);text-decoration:none;padding:5px 8px;border-radius:6px;font-size:14px}
.nv-k:hover,.nv-i a:hover{color:var(--fg)}
.nv-k.on{color:var(--fg);background:var(--btn)}
.nv-k .badge,.nv-k .sub,.nv-k .dot{margin-left:auto}
.nv-k .dot+.sub{margin-left:0}
.ver{font-size:12px;padding:12px 10px 0}
.sub{font-size:12px;color:var(--mut);white-space:nowrap}
.badge{font-size:12px;padding:0 7px;border-radius:99px;background:var(--btn);border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.badge.acc{color:#111;background:var(--acc);border-color:transparent}
.badge.bad{color:var(--bad)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none;vertical-align:middle}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.run{background:var(--acc)}
table.kv{border-collapse:collapse;width:100%;font-size:14px}
table.kv td,table.kv th{padding:5px 6px;text-align:left;border-bottom:1px solid var(--line)}
table.kv th{color:var(--mut);font-weight:500}
.scrim{display:none}
@media (max-width:820px){
  aside{position:fixed;left:0;top:0;z-index:20;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 24px rgba(0,0,0,.4)}
  .app.drawer aside{transform:none}
  .app.drawer .scrim{display:block;position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.45)}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 16px}
  .topbar button{padding:3px 10px;font-size:18px}
  main{padding:12px 16px 40px}
}
button{font:inherit;color:var(--fg);background:var(--btn);border:1px solid var(--line);border-radius:7px;padding:7px 12px;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
button.yes{background:var(--yes);color:#fff;border-color:transparent}
button.no{background:var(--no);color:#fff;border-color:transparent}
button.pri{background:var(--acc);color:#111;border-color:transparent}
select{font:inherit;color:var(--fg);background:var(--btn);border:1px solid var(--line);border-radius:7px;padding:6px 8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mut{color:var(--mut)}
.err{color:var(--bad)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h3{margin:0 0 6px;font-size:15px}
.card p{margin:4px 0}
.card .row{margin-top:10px}
.card+.card{margin-top:12px}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:13px;background:var(--btn);border:1px solid var(--line)}
.pill.ok{color:var(--ok)}.pill.bad{color:var(--bad)}.pill.acc{color:var(--acc)}
.pic{position:relative;background:#000;user-select:none;-webkit-user-select:none;touch-action:none;line-height:0}
.pic img{display:block;width:100%;height:auto}
.pic svg{position:absolute;inset:0;width:100%;height:100%}
.pic canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pic.heat img{position:absolute;inset:0;width:100%;height:100%}
.seg{display:inline-flex;margin-left:8px}
.seg button{border-radius:0}
.seg button:first-child{border-radius:6px 0 0 6px}
.seg button:last-child{border-radius:0 6px 6px 0}
.seg button.on{background:var(--acc);color:#111;border-color:transparent}
.pics{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:10px;align-items:start}
@media (max-width:820px){.pics{grid-template-columns:minmax(0,1fr)}}
.zoomwrap{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-height:120px;display:flex;align-items:center;justify-content:center}
.zoomwrap .pic{width:100%}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.actions button{padding:13px 6px;font-size:16px}
@media (max-width:520px){.actions{grid-template-columns:repeat(2,1fr)}}
kbd{font:12px ui-monospace,monospace;border:1px solid var(--line);border-radius:4px;padding:0 4px;opacity:.7}
svg .sel{fill:none;stroke:#ffd400;stroke-width:3px;vector-effect:non-scaling-stroke}
svg .alt{fill:none;stroke:#00e5ff;stroke-width:2px;stroke-dasharray:6 4;vector-effect:non-scaling-stroke}
svg .drawn{fill:none;stroke:#39ff14;stroke-width:3px;vector-effect:non-scaling-stroke}
svg .hint{fill:none;stroke:#fff;stroke-width:2px;stroke-dasharray:2 4;vector-effect:non-scaling-stroke}
svg .ol{fill:rgba(255,79,216,.12);stroke:#ff4fd8;stroke-width:2.5px;vector-effect:non-scaling-stroke}
svg .vx{fill:#ff4fd8;stroke:#fff;stroke-width:1.5px;vector-effect:non-scaling-stroke;cursor:move}
svg .vx.selv{fill:#ffd400}
svg .mid{fill:rgba(255,255,255,.55);stroke:#ff4fd8;stroke-width:1px;vector-effect:non-scaling-stroke;cursor:copy}
svg .ft{fill:rgba(255,212,0,.55)}
svg text{fill:#fff;paint-order:stroke;stroke:#000;stroke-width:3px;vector-effect:non-scaling-stroke;font-family:system-ui,sans-serif}
.strip{display:grid;grid-template-columns:repeat(25,1fr);gap:2px;margin:8px 0 2px}
.strip div{height:28px;border-radius:3px;background:var(--btn)}
.strip .in{background:var(--ok)}.strip .out{background:var(--bad)}.strip .none{background:#5b6270}
.striplab{display:grid;grid-template-columns:repeat(25,1fr);gap:2px;font-size:11px;color:var(--mut)}
.figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
figure{margin:0}figcaption{font-size:13px;color:var(--mut);padding:4px 2px}
pre{white-space:pre-wrap;word-break:break-word;font:12px/1.4 ui-monospace,monospace;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;max-height:320px;overflow:auto}
.legend span{display:inline-flex;align-items:center;gap:4px;margin-right:12px;font-size:13px;color:var(--mut)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:8px 14px;border-radius:8px;z-index:30}
</style>
</head>
<body>
<div id="root"></div>
<script src="app.js"></script>
</body>
</html>
